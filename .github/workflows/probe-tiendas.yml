name: Sondeo de tiendas populares

# Workflow temporal de diagnóstico. Busca qué tiendas populares en España
# que aún no cubrimos son viables, y por qué vía.
#
# La pista más prometedora: Cortefiel y Womensecret son del grupo Tendam y
# las dos funcionan con la misma técnica (JSON-LD por tarjeta). Springfield,
# Pedro del Hierro y Fifty son del mismo grupo, así que deberían caer con el
# scraper que ya tenemos.
#
# Para cada tienda: se busca el enlace real de rebajas en su portada (las
# URLs adivinadas dan 404 y se confunden con bloqueos), y luego se mira si
# la página trae Shopify products.json, JSON-LD de producto, __NEXT_DATA__ o
# microdatos schema.org.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-tiendas.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear
        run: |
          node -e '
          const tiendas = {
            // Grupo Tendam: misma plataforma que Cortefiel y Womensecret,
            // que ya funcionan. Máxima prioridad.
            springfield: "https://www.myspringfield.com",
            pedrodelhierro: "https://www.pedrodelhierro.com",
            fifty: "https://www.fifty.es",
            // Cadenas grandes en España que aún no hemos probado a fondo
            sfera: "https://www.sfera.com",
            elcorteingles: "https://www.elcorteingles.es",
            bimbaylola: "https://www.bimbaylola.com",
            adolfodominguez: "https://www.adolfodominguez.com",
            elganso: "https://www.elganso.com",
            silbon: "https://silbonshop.com",
            purificaciongarcia: "https://www.purificaciongarcia.com",
            hoss: "https://hossintropia.com",
            bipandbop: "https://www.bipandbop.com",
          };
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";
          const H = { "User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9" };

          async function get(url) {
            try {
              const r = await fetch(url, { headers: H, redirect: "follow", signal: AbortSignal.timeout(25000) });
              return { status: r.status, url: r.url, body: await r.text() };
            } catch (e) { return { status: 0, error: e.message, body: "" }; }
          }

          function enlaceRebajas(html, base) {
            // Buscar en la portada el enlace real de rebajas/outlet
            const re = /href="([^"]*(?:rebajas|sale|outlet|descuento)[^"]*)"/gi;
            const vistos = new Set();
            for (const m of html.matchAll(re)) {
              let h = m[1];
              if (h.startsWith("//")) h = "https:" + h;
              else if (h.startsWith("/")) h = base + h;
              else if (!h.startsWith("http")) continue;
              if (h.includes("javascript") || vistos.has(h)) continue;
              vistos.add(h);
              if (vistos.size >= 4) break;
            }
            return [...vistos];
          }

          function analizar(html) {
            const señales = [];
            const ld = [...html.matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)];
            let productosLd = 0;
            for (const m of ld) {
              try {
                const t = JSON.stringify(JSON.parse(m[1]));
                productosLd += (t.match(/"@type":"Product"/g) || []).length;
              } catch {}
            }
            if (productosLd) señales.push("JSON-LD Product x" + productosLd);
            if (/__NEXT_DATA__/.test(html)) señales.push("__NEXT_DATA__");
            if (/window\.__NUXT__/.test(html)) señales.push("__NUXT__");
            const micro = (html.match(/itemprop="price"/g) || []).length;
            if (micro) señales.push("microdatos price x" + micro);
            const enlacesProd = new Set([...html.matchAll(/href="([^"]*\/(?:p|producto|product|prod)\/[^"]*)"/gi)].map((m) => m[1]));
            if (enlacesProd.size) señales.push("enlaces de producto x" + enlacesProd.size);
            return señales.length ? señales.join(", ") : "nada reconocible";
          }

          (async () => {
            for (const [id, base] of Object.entries(tiendas)) {
              console.log("\n########## " + id + "  " + base);

              // 1. ¿Es Shopify? Es la vía más fácil con diferencia.
              const shop = await get(base + "/products.json?limit=3&country=ES");
              let esShopify = false;
              try {
                const d = JSON.parse(shop.body);
                if (d.products) {
                  esShopify = true;
                  const v = d.products[0] && d.products[0].variants[0];
                  console.log("  SHOPIFY ✅  productos=" + d.products.length +
                    (v ? "  ej: " + d.products[0].title + " " + v.price + " (compare " + v.compare_at_price + ")" : ""));
                }
              } catch {}
              if (!esShopify) console.log("  shopify products.json -> HTTP " + shop.status);

              // 2. Portada + enlace real de rebajas
              const home = await get(base);
              console.log("  portada -> HTTP " + (home.status || home.error));
              if (home.status !== 200) continue;

              const enlaces = enlaceRebajas(home.body, base);
              if (!enlaces.length) { console.log("  sin enlace de rebajas en la portada"); continue; }
              console.log("  enlaces de rebajas: " + enlaces.slice(0, 2).join(" | "));

              const r = await get(enlaces[0]);
              console.log("  rebajas -> HTTP " + (r.status || r.error) + "  " + (r.status === 200 ? analizar(r.body) : ""));
            }
          })();
          '
