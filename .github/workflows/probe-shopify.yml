name: Sondeo Shopify (country=ES)

# Workflow temporal de diagnóstico. Ya está confirmado que Shopify asigna el
# mercado por IP y que el runner de GitHub se geolocaliza en Estados Unidos,
# así que las tiendas con precios por mercado nos devuelven la lista
# internacional. Añadir ?country=ES a la ficha devuelve los precios españoles.
#
# Falta comprobar dos cosas antes de tocar el scraper:
#   1. Que /products.json (el endpoint que usamos) también respete country=ES.
#   2. A cuántas de las ocho tiendas les cambia el precio.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-shopify.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comparar con y sin country=ES
        run: |
          node -e '
          const tiendas = {
            coosy: "https://coosy.es",
            laagam: "https://laagam.com",
            popa: "https://popabrand.com",
            bimani: "https://bimani.es",
            pompeii: "https://pompeiibrand.com",
            bluebanana: "https://www.bluebananabrand.com",
            scalpers: "https://scalperscompany.com",
            poete: "https://poete.es",
          };
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

          async function productos(url) {
            const r = await fetch(url, {
              headers: { "User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9" },
            });
            if (!r.ok) return null;
            const d = await r.json();
            return d.products || [];
          }

          (async () => {
            for (const [id, base] of Object.entries(tiendas)) {
              const sin = await productos(base + "/products.json?limit=20");
              const con = await productos(base + "/products.json?limit=20&country=ES");
              if (!sin || !con) { console.log(id + ": error"); continue; }

              const mapa = new Map(con.map((p) => [p.handle, p.variants[0]]));
              let distintos = 0, iguales = 0, ejemplo = "";
              let factor = null;
              for (const p of sin) {
                const a = p.variants[0], b = mapa.get(p.handle);
                if (!b) continue;
                if (a.price === b.price) { iguales++; continue; }
                distintos++;
                if (!ejemplo) {
                  ejemplo = p.handle + ": " + a.price + " -> " + b.price +
                            "  (compare " + a.compare_at_price + " -> " + b.compare_at_price + ")";
                  factor = (Number(a.price) / Number(b.price)).toFixed(6);
                }
              }
              console.log("\n########## " + id);
              console.log("  precios que cambian: " + distintos + " de " + (distintos + iguales));
              if (ejemplo) console.log("  ejemplo: " + ejemplo + "   factor=" + factor);
            }
          })();
          '
