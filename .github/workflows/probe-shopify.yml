name: Sondeo Shopify (precio Coosy)

# Workflow temporal de diagnóstico. Coosy devuelve por API 41,90 € / 193,39 €
# para un producto que en su web se ve a 39,00 € / 180,00 €. El factor
# (1,074383) es constante y afecta también al precio tachado, y cart.js
# declara EUR, así que no es un cambio de moneda.
#
# Dos hipótesis que esto distingue:
#   A) Shopify Markets asigna mercado por IP y el runner (Azure, fuera de
#      España) recibe una lista de precios internacional. Entonces el HTML
#      de la ficha traerá 41,90 y no habrá forma de ver 39,00 desde aquí
#      salvo forzando el país.
#   B) El precio de la web lo pinta el tema o una app a partir de otro campo.
#      Entonces el HTML traerá 39,00 aunque la API diga 41,90.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-shopify.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sondear la ficha de Coosy
        run: |
          node -e '
          const HANDLE = "sandalias-plataformanegro";
          const BASE = "https://coosy.es";
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

          async function get(url, extra = {}) {
            const r = await fetch(url, {
              headers: { "User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9", ...extra },
              redirect: "follow",
            });
            return { status: r.status, url: r.url, body: await r.text() };
          }

          // Saca todos los importes que parezcan precios del HTML.
          function precios(html) {
            const set = new Map();
            for (const m of html.matchAll(/(\d{1,4}[.,]\d{2})\s*(?:&nbsp;|\s)?€/g)) {
              const v = m[1].replace(",", ".");
              set.set(v, (set.get(v) || 0) + 1);
            }
            return [...set].sort((a, b) => b[1] - a[1]).slice(0, 12);
          }
          function campos(html, claves) {
            const out = [];
            for (const k of claves) {
              const re = new RegExp("\"" + k + "\"\\s*:\\s*\"?([\\d.,]+)\"?", "g");
              const vals = [...html.matchAll(re)].map((m) => m[1]).slice(0, 6);
              if (vals.length) out.push(k + "=" + vals.join(","));
            }
            return out.join("  ");
          }

          (async () => {
            const casos = [
              ["ficha normal", BASE + "/products/" + HANDLE, {}],
              ["ficha ?country=ES", BASE + "/products/" + HANDLE + "?country=ES", {}],
              ["ficha cookie localization=ES", BASE + "/products/" + HANDLE, { Cookie: "localization=ES; cart_currency=EUR" }],
              ["ficha cabecera ES", BASE + "/products/" + HANDLE, { "CF-IPCountry": "ES", "X-Forwarded-For": "88.19.0.1" }],
            ];
            for (const [nombre, url, extra] of casos) {
              const r = await get(url, extra);
              console.log("\n##### " + nombre + "  HTTP " + r.status);
              console.log("   url final: " + r.url);
              console.log("   precios en el HTML: " + JSON.stringify(precios(r.body)));
              console.log("   campos JSON: " + campos(r.body, ["price", "compare_at_price", "priceCurrency", "lowPrice"]));
            }

            for (const [nombre, url, extra] of [
              ["json normal", BASE + "/products/" + HANDLE + ".js", {}],
              ["json ?country=ES", BASE + "/products/" + HANDLE + ".js?country=ES", {}],
              ["json cookie ES", BASE + "/products/" + HANDLE + ".js", { Cookie: "localization=ES; cart_currency=EUR" }],
            ]) {
              const r = await get(url, extra);
              try {
                const d = JSON.parse(r.body);
                const v = d.variants[0];
                console.log("\n##### " + nombre + " -> price=" + d.price / 100 + "  compare=" + (v.compare_at_price / 100));
              } catch { console.log("\n##### " + nombre + " -> HTTP " + r.status + " (sin JSON)"); }
            }

            // ¿Qué mercados publica la tienda?
            const loc = await get(BASE + "/browsing_context_suggestions.json");
            console.log("\n##### browsing_context_suggestions -> " + loc.body.slice(0, 500));
          })();
          '
