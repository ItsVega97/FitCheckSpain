name: Sondear tiendas

# Comprueba si el catálogo de rebajas de cada tienda candidata se puede
# extraer y por qué vía. El entorno de desarrollo no tiene salida a las
# tiendas, así que esto se ejecuta en un runner.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qué sondear"
        required: false
        default: viabilidad
        type: choice
        options: [viabilidad, descuentos, navegador, estructura]
      tiendas:
        description: "IDs separados por espacios (solo para viabilidad; vacío = todas)"
        required: false
        default: ""
  push:
    paths:
      - "scripts/sondear-tiendas.ts"
      - "scripts/sondear-descuentos.ts"
      - "scripts/sondear-navegador.ts"
      - "scripts/sondear-estructura.ts"

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # Al empujar, se ejecuta solo el sondeo cuyo script ha cambiado; a
      # mano, el que se elija. Antes esto miraba el mensaje del commit, que
      # hacía correr el sondeo largo (4 min) aunque no fuera el que tocaba.
      - name: Decidir qué sondeo toca
        id: cual
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tipo=${{ inputs.tipo }}" >> "$GITHUB_OUTPUT"
          else
            cambiados=$(git diff --name-only HEAD~1 HEAD -- scripts/ || true)
            tipo=viabilidad
            case "$cambiados" in
              *sondear-estructura*) tipo=estructura ;;
              *sondear-navegador*)  tipo=navegador ;;
              *sondear-descuentos*) tipo=descuentos ;;
            esac
            echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          fi
          echo "Sondeo: $(grep tipo= "$GITHUB_OUTPUT" | tail -1)"

      - name: Instalar Chromium
        if: contains(fromJSON('["navegador","estructura"]'), steps.cual.outputs.tipo)
        run: npx playwright install chromium

      - name: Sondear
        run: |
          case "${{ steps.cual.outputs.tipo }}" in
            viabilidad) npx tsx scripts/sondear-tiendas.ts ${{ inputs.tiendas }} ;;
            descuentos) npx tsx scripts/sondear-descuentos.ts ;;
            *)
              Xvfb :99 -screen 0 1366x768x24 &
              sleep 2
              DISPLAY=:99 npx tsx scripts/sondear-${{ steps.cual.outputs.tipo }}.ts
              ;;
          esac
