name: Sondear tiendas

# Comprueba si el catálogo de rebajas de cada tienda candidata se puede
# extraer y por qué vía. El entorno de desarrollo no tiene salida a las
# tiendas, así que esto se ejecuta en un runner.
on:
  workflow_dispatch:
    inputs:
      tiendas:
        description: "IDs separados por espacios (vacío = todas)"
        required: false
        default: ""
  push:
    paths:
      - "scripts/sondear-tiendas.ts"
      - "scripts/sondear-descuentos.ts"
      - "scripts/sondear-navegador.ts"
      - "scripts/sondear-estructura.ts"

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Sondear viabilidad
        if: ${{ !contains(github.event.head_commit.message, 'descuentos') }}
        run: npx tsx scripts/sondear-tiendas.ts ${{ inputs.tiendas }}
      - name: Sondear descuentos
        if: ${{ contains(github.event.head_commit.message, 'descuentos') }}
        run: npx tsx scripts/sondear-descuentos.ts
      - name: Instalar Chromium
        if: ${{ contains(github.event.head_commit.message, 'navegador') || contains(github.event.head_commit.message, 'estructura') }}
        run: npx playwright install chromium
      - name: Sondear con navegador
        if: ${{ contains(github.event.head_commit.message, 'navegador') }}
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 npx tsx scripts/sondear-navegador.ts
      - name: Sondear estructura
        if: ${{ contains(github.event.head_commit.message, 'estructura') }}
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 npx tsx scripts/sondear-estructura.ts
