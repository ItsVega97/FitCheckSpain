name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # Este bloque no necesita navegador: va primero para que sus
      # resultados lleguen aunque la instalacion de Chromium falle.
      - name: A) Sondear tiendas Shopify (sin navegador)
        timeout-minutes: 5
        run: node scripts/_debug-probe.mjs shopify

      # Sin --with-deps: las librerias del sistema ya estan en el runner y
      # el apt-get update se atasca contra los mirrors de Ubuntu.
      - name: Instalar Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: B) Sondear cadenas grandes (headed + Xvfb)
        timeout-minutes: 12
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 node scripts/_debug-probe.mjs cadenas
