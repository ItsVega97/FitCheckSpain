name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # IMPORTANTE: el Chromium se instala ANTES de meter patchright.
      # patchright es un fork de playwright y pisa su CLI, con lo que
      # `npx playwright install` acabaria ejecutando el instalador de
      # patchright y colgandose (visto en dos runs previos).
      - name: Instalar Chromium (compartido por ambos drivers)
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium

      - name: Instalar patchright (solo para la prueba A/B)
        run: npm install --no-save patchright

      - name: A/B Playwright vs Patchright (headed + Xvfb)
        timeout-minutes: 6
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 node scripts/_debug-probe.mjs
