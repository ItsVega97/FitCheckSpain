name: Debug fetch 12 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Estructura completa de producto Desigual y Puma
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          fetch() {
            curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 20 "$1" -o "$2" -w "HTTP: %{http_code}\n"
            echo "tamano: $(wc -c < "$2") bytes"
          }

          echo "=================================================="
          echo "### Desigual: bloque ItemList completo"
          fetch "https://www.desigual.com/es_ES/rebajas/" /tmp/desigual.html
          python3 -c '
          import re, json
          html = open("/tmp/desigual.html", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"<script type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          for b in blocks:
              if "ItemList" in b:
                  try:
                      data = json.loads(b)
                  except Exception as e:
                      print("JSON parse error:", e)
                      continue
                  graph = data.get("@graph", [data])
                  for node in graph:
                      if node.get("@type") == "ItemList":
                          items = node.get("itemListElement", [])
                          print("total items:", len(items))
                          print(json.dumps(items[0], indent=2, ensure_ascii=False)[:1500])
                          print("---segundo item---")
                          print(json.dumps(items[1], indent=2, ensure_ascii=False)[:1500])
          '

          echo "=================================================="
          echo "### Puma: bloque ItemList completo"
          fetch "https://es.puma.com/es/es/sale" /tmp/puma.html
          python3 -c '
          import re, json
          html = open("/tmp/puma.html", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"<script type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          longest = max(blocks, key=len)
          try:
              data = json.loads(longest)
          except Exception as e:
              print("JSON parse error:", e)
              data = None
          if data:
              items = data.get("itemListElement") or data.get("mainEntity", {}).get("itemListElement", [])
              print("total items:", len(items))
              print(json.dumps(items[0], indent=2, ensure_ascii=False)[:1500])
              print("---segundo item---")
              print(json.dumps(items[1], indent=2, ensure_ascii=False)[:1500])
          '
