name: Debug fetch 7 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar ruta de busqueda correcta en Chollometro
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.chollometro.com/" -o /tmp/home.html -w "HTTP: %{http_code}\n"
          grep -oiE 'action="[^"]*"|href="[^"]*search[^"]*"|href="[^"]*buscar[^"]*"' /tmp/home.html | sort -u | head -10
