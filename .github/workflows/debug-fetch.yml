name: Debug fetch - explorar Zara/Mango/Zalando desbloqueados (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de exploración
        run: |
          cat > explore.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

          const browser = await chromium.launch({
            headless: false,
            args: ["--disable-blink-features=AutomationControlled"],
          });

          async function newPage() {
            const context = await browser.newContext({
              userAgent: UA,
              locale: "es-ES",
              timezoneId: "Europe/Madrid",
              viewport: { width: 1366, height: 768 },
              extraHTTPHeaders: { "Accept-Language": "es-ES,es;q=0.9,en;q=0.8" },
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, "webdriver", { get: () => undefined });
            });
            return { context, page: await context.newPage() };
          }

          // 1) Buscar enlace real de rebajas en Mango y Zalando
          async function findSaleLink(name, homeUrl) {
            const { context, page } = await newPage();
            try {
              await page.goto(homeUrl, { waitUntil: "domcontentloaded", timeout: 25000 });
              await page.waitForTimeout(1500);
              const links = await page.evaluate(() => {
                return Array.from(document.querySelectorAll("a[href]"))
                  .map((a) => ({ href: a.getAttribute("href"), text: a.textContent.trim() }))
                  .filter(
                    (l) =>
                      /rebaja|sale|outlet/i.test(l.href || "") || /rebaja|sale|outlet/i.test(l.text || ""),
                  )
                  .slice(0, 10);
              });
              console.log(`=== ${name} enlaces rebajas ===`);
              console.log(JSON.stringify(links, null, 2));
            } catch (e) {
              console.log(`${name}: ERROR ${e.message}`);
            } finally {
              await context.close();
            }
          }
          await findSaleLink("Mango", "https://shop.mango.com/es/es");
          await findSaleLink("Zalando", "https://www.zalando.es/");

          // 2) Inspeccionar estructura de datos de Zara (ya carga con 200)
          const { context, page } = await newPage();
          try {
            await page.goto("https://www.zara.com/es/es/mujer-special-prices-l1309.html", {
              waitUntil: "domcontentloaded",
              timeout: 25000,
            });
            await page.waitForTimeout(3000);
            const info = await page.evaluate(() => {
              const html = document.documentElement.outerHTML;
              const hasNextData = html.includes("__NEXT_DATA__");
              const hasLdJson = html.includes("application/ld+json");
              const jsonLdCount = document.querySelectorAll('script[type="application/ld+json"]').length;
              const links = Array.from(document.querySelectorAll("a[href]"))
                .map((a) => a.getAttribute("href"))
                .filter((h) => h && /-p\d+\.html/.test(h))
                .slice(0, 5);
              return { bytes: html.length, hasNextData, hasLdJson, jsonLdCount, sampleProductLinks: links };
            });
            console.log("=== Zara estructura ===");
            console.log(JSON.stringify(info, null, 2));
            if (info.jsonLdCount > 0) {
              const sample = await page.evaluate(() => {
                const el = document.querySelector('script[type="application/ld+json"]');
                return el ? el.textContent.slice(0, 1500) : null;
              });
              console.log("--- muestra JSON-LD ---");
              console.log(sample);
            }
          } catch (e) {
            console.log(`Zara: ERROR ${e.message}`);
          } finally {
            await context.close();
          }

          await browser.close();
          EOF
      - name: Lanzar Xvfb y explorar
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 node explore.mjs
