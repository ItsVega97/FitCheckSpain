name: Debug fetch - Womensecret v2 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de inspección amplia
        run: |
          cat > inspect-ws3.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const browser = await chromium.launch();
          const context = await browser.newContext({ userAgent: UA, locale: "es-ES" });
          const page = await context.newPage();
          await page.goto("https://www.womensecret.com/es/rebajas", { waitUntil: "networkidle", timeout: 30000 });
          await page.waitForTimeout(3000);

          console.log("URL final tras redirecciones:", page.url());

          const info = await page.evaluate(() => {
            const allClasses = new Set();
            document.querySelectorAll("[class]").forEach((el) => {
              el.className
                .toString()
                .split(/\s+/)
                .forEach((c) => {
                  if (/tile|product|grid|card|plp|item-/i.test(c)) allClasses.add(c);
                });
            });
            const productLinks = Array.from(document.querySelectorAll("a[href]"))
              .map((a) => a.getAttribute("href"))
              .filter((h) => h && /\.html|\/p\/|product/i.test(h))
              .slice(0, 10);
            return {
              classesEncontradas: Array.from(allClasses).slice(0, 60),
              ejemploLinksProducto: productLinks,
              totalImgs: document.querySelectorAll("img").length,
            };
          });
          console.log(JSON.stringify(info, null, 2));

          await browser.close();
          EOF
      - name: Inspeccionar clases y enlaces reales
        run: node inspect-ws3.mjs
