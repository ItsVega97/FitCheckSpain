name: Debug fetch - estructura Mango y Zalando reales (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de inspección
        run: |
          cat > inspect2.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

          const browser = await chromium.launch({
            headless: false,
            args: ["--disable-blink-features=AutomationControlled"],
          });

          async function newPage() {
            const context = await browser.newContext({
              userAgent: UA,
              locale: "es-ES",
              timezoneId: "Europe/Madrid",
              viewport: { width: 1366, height: 768 },
              extraHTTPHeaders: { "Accept-Language": "es-ES,es;q=0.9,en;q=0.8" },
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, "webdriver", { get: () => undefined });
            });
            return { context, page: await context.newPage() };
          }

          async function inspect(name, url) {
            const { context, page } = await newPage();
            try {
              const res = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 25000 });
              await page.waitForTimeout(3000);
              await page.mouse.wheel(0, 2000);
              await page.waitForTimeout(1500);
              const info = await page.evaluate(() => {
                const html = document.documentElement.outerHTML;
                const jsonLdCount = document.querySelectorAll('script[type="application/ld+json"]').length;
                const hasNextData = !!document.getElementById("__NEXT_DATA__");
                const allClasses = new Set();
                document.querySelectorAll("[class]").forEach((el) => {
                  el.className
                    .toString()
                    .split(/\s+/)
                    .forEach((c) => {
                      if (/tile|product|grid|card|item-box|article/i.test(c)) allClasses.add(c);
                    });
                });
                return {
                  bytes: html.length,
                  jsonLdCount,
                  hasNextData,
                  classes: Array.from(allClasses).slice(0, 40),
                };
              });
              console.log(`=== ${name}: HTTP ${res.status()} ===`);
              console.log(JSON.stringify(info, null, 2));
              if (info.jsonLdCount > 0) {
                const samples = await page.evaluate(() =>
                  Array.from(document.querySelectorAll('script[type="application/ld+json"]'))
                    .slice(0, 2)
                    .map((el) => el.textContent.slice(0, 800)),
                );
                console.log("--- muestras JSON-LD ---");
                samples.forEach((s) => console.log(s));
              }
            } catch (e) {
              console.log(`${name}: ERROR ${e.message}`);
            } finally {
              await context.close();
            }
          }

          await inspect("Mango mujer rebajas", "https://shop.mango.com/es/es/c/mujer/rebajas--70/93ea7423");
          await inspect("Zalando rebajas", "https://www.zalando.es/rebajas/");

          await browser.close();
          EOF
      - name: Lanzar Xvfb e inspeccionar
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 node inspect2.mjs
