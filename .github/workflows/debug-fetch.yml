name: Debug fetch - Womensecret remate-final (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de inspección de remate-final
        run: |
          cat > inspect-remate.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const browser = await chromium.launch();
          const context = await browser.newContext({ userAgent: UA, locale: "es-ES" });
          const page = await context.newPage();
          await page.goto("https://womensecret.com/es/es/promociones/remate-final/mujer", {
            waitUntil: "networkidle",
            timeout: 30000,
          });
          await page.waitForTimeout(2500);

          console.log("URL final:", page.url());

          const info = await page.evaluate(() => {
            const allClasses = new Set();
            document.querySelectorAll("[class]").forEach((el) => {
              el.className
                .toString()
                .split(/\s+/)
                .forEach((c) => {
                  if (/tile|product|grid|card|plp|item/i.test(c)) allClasses.add(c);
                });
            });
            const productLinks = Array.from(document.querySelectorAll("a[href]"))
              .map((a) => a.getAttribute("href"))
              .filter((h) => h && /\.html/.test(h))
              .slice(0, 10);
            return {
              classesEncontradas: Array.from(allClasses).slice(0, 80),
              ejemploLinksHtml: productLinks,
              totalImgs: document.querySelectorAll("img").length,
            };
          });
          console.log(JSON.stringify(info, null, 2));

          // Si hay algo con "product" en la clase, vuelca el primero entero
          const sample = await page.evaluate(() => {
            const el = document.querySelector('[class*="product"]');
            return el ? el.outerHTML.slice(0, 2500) : null;
          });
          console.log("--- muestra de elemento [class*=product] ---");
          console.log(sample);

          await browser.close();
          EOF
      - name: Inspeccionar remate-final
        run: node inspect-remate.mjs
