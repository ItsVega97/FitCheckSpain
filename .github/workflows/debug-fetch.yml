name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URLs de tiendas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          check() {
            local name="$1"
            local url="$2"
            echo "=================================================="
            echo "### $name -> $url"
            code=$(curl -s -o /tmp/body.html -D /tmp/headers.txt -w "%{http_code}" \
              -A "$UA" \
              -H "Accept-Language: es-ES,es;q=0.9" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --max-time 15 "$url" || echo "CURL_ERROR")
            echo "HTTP: $code"
            echo "--- headers relevantes ---"
            grep -iE "^(server|cf-|x-akamai|x-cache|location|content-type):" /tmp/headers.txt || true
            echo "--- primeros 300 chars body ---"
            head -c 300 /tmp/body.html
            echo ""
            echo "--- posibles enlaces de rebajas/outlet en el HTML ---"
            grep -oiE 'href="[^"]*(sale|rebaja|outlet|promo|descuento)[^"]*"' /tmp/body.html | sort -u | head -15 || true
            echo ""
          }

          echo "=================================================="
          echo "### ASOS mujer rebajas cid=5526 - inspeccionar JSON window.asos.plp._data"
          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/mujer/rebajas/a-to-z-of-brands/cat/?cid=5526" -o /tmp/asos.html
          echo "tamaño: $(wc -c < /tmp/asos.html) bytes"
          python3 - <<'PYEOF'
import re
html = open("/tmp/asos.html", encoding="utf-8", errors="replace").read()
m = re.search(r"window\.asos\.plp\._data\s*=\s*(\{.*?\});", html, re.DOTALL)
if not m:
    print("NO SE ENCONTRÓ el bloque window.asos.plp._data")
else:
    blob = m.group(1)
    print("Longitud del bloque JSON:", len(blob))
    import json
    try:
        data = json.loads(blob)
        print("JSON parseado OK. Claves de primer nivel:", list(data.keys())[:20])
        products = data.get("products") or data.get("Products")
        if products:
            print("Nº de productos:", len(products))
            print("Claves del primer producto:", list(products[0].keys()))
            print("Primer producto (recortado):", json.dumps(products[0], ensure_ascii=False)[:1500])
        else:
            print("No hay 'products' en las claves de primer nivel, buscando anidado...")
            print(json.dumps(data, ensure_ascii=False)[:1500])
    except Exception as e:
        print("Fallo al parsear JSON:", e)
        print("Primeros 1500 chars del blob:", blob[:1500])
PYEOF
