name: Debug fetch 9 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Encontrar URLs reales y estructura
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          find_links() {
            local name="$1"
            local url="$2"
            local pattern="$3"
            echo "=================================================="
            echo "### $name home -> $url"
            code=$(curl -s -L --compressed -o /tmp/body.html -D /tmp/headers.txt -w "%{http_code}" \
              -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 "$url")
            echo "HTTP final: $code, tamano: $(wc -c < /tmp/body.html) bytes"
            grep -oiE "$pattern" /tmp/body.html | sort -u | head -8 || true
          }

          find_links "Desigual" "https://www.desigual.com/es/" 'href="[^"]*(rebaja|sale|outlet)[^"]*"'
          find_links "Superdry" "https://www.superdry.com/es/" 'href="[^"]*(sale|rebaja)[^"]*"'
          find_links "Puma" "https://es.puma.com/" 'href="[^"]*(sale|rebaja|outlet)[^"]*"'
          find_links "Skechers" "https://www.skechers.com/" 'href="[^"]*(sale|rebaja|outlet)[^"]*"'
          find_links "Shein" "https://es.shein.com/" 'href="[^"]*(sale|rebaja)[^"]*"'

          echo "=================================================="
          echo "### Footlocker sale.html: buscar JSON de listado real"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.footlocker.es/es/sale.html" -o /tmp/fl.html
          echo "tamano: $(wc -c < /tmp/fl.html) bytes"
          grep -oE '"@type":"Product"|"@type": "Product"|window\.__PRELOADED_STATE__|__NEXT_DATA__|"products":\[' /tmp/fl.html | sort -u | head -5 || true
          grep -c 'productTile\|product-tile\|product-card' /tmp/fl.html || true
