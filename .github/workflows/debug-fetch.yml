name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URLs de tiendas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          check() {
            local name="$1"
            local url="$2"
            echo "=================================================="
            echo "### $name -> $url"
            code=$(curl -s -o /tmp/body.html -D /tmp/headers.txt -w "%{http_code}" \
              -A "$UA" \
              -H "Accept-Language: es-ES,es;q=0.9" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --max-time 15 "$url" || echo "CURL_ERROR")
            echo "HTTP: $code"
            echo "--- headers relevantes ---"
            grep -iE "^(server|cf-|x-akamai|x-cache|location|content-type):" /tmp/headers.txt || true
            echo "--- primeros 300 chars body ---"
            head -c 300 /tmp/body.html
            echo ""
            echo "--- posibles enlaces de rebajas/outlet en el HTML ---"
            grep -oiE 'href="[^"]*(sale|rebaja|outlet|promo|descuento)[^"]*"' /tmp/body.html | sort -u | head -15 || true
            echo ""
          }

          check "Mango rebajas mujer (es/es)" "https://shop.mango.com/es/es/mujer/rebajas"

          echo "=================================================="
          echo "### ASOS rebajas hombre cid=8409 - buscar link a mujer y JSON embebido"
          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/hombre/rebajas/cat/?cid=8409" -o /tmp/asos.html
          echo "tamaño: $(wc -c < /tmp/asos.html) bytes"
          echo "--- links a categoría mujer / rebajas mujer ---"
          grep -oiE 'href="[^"]*mujer[^"]*rebaja[^"]*"|href="[^"]*rebaja[^"]*mujer[^"]*"' /tmp/asos.html | sort -u | head -10 || true
          echo "--- ¿hay JSON de estado embebido? ---"
          grep -oE '(window\.asos[a-zA-Z_.]*|__NEXT_DATA__|__INITIAL_STATE__|"products":\[)' /tmp/asos.html | sort -u | head -10 || true
          echo "--- ¿hay etiquetas de producto (data-testid, class product) ---"
          grep -oE 'data-testid="[a-zA-Z-]*product[a-zA-Z-]*"|data-auto-id="[a-zA-Z-]*"' /tmp/asos.html | sort -u | head -15 || true
          echo "--- fragmento alrededor de la primera aparición de \"price\" ---"
          grep -oE '.{80}price.{80}' /tmp/asos.html | head -5 || true
