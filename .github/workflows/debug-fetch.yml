name: Debug fetch 15 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Escribir script de prueba
        run: |
          cat > tmp-test-puma.ts << 'EOF'
          import { scrapePuma } from "./scripts/scrapers/puma";

          scrapePuma()
            .then(({ deals, cardsFound }) => {
              console.log("cardsFound:", cardsFound);
              console.log("deals:", deals.length);
              console.log(JSON.stringify(deals.slice(0, 3), null, 2));
            })
            .catch((e) => {
              console.error(e);
              process.exit(1);
            });
          EOF
      - name: Probar scrapePuma real
        run: npx tsx tmp-test-puma.ts
