name: Debug fetch - Womensecret selectors (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de inspección de selectores
        run: |
          cat > inspect-ws2.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const browser = await chromium.launch();
          const context = await browser.newContext({ userAgent: UA, locale: "es-ES" });
          const page = await context.newPage();
          await page.goto("https://www.womensecret.com/es/rebajas", { waitUntil: "networkidle", timeout: 30000 });
          await page.waitForTimeout(2000);

          // Encuentra el primer elemento cuya clase contenga "product-tile" real (no dentro de <script>)
          const info = await page.evaluate(() => {
            const tiles = Array.from(document.querySelectorAll('[class*="product-tile"]'));
            if (tiles.length === 0) return { count: 0 };
            const first = tiles[0];
            return {
              count: tiles.length,
              tag: first.tagName,
              className: first.className,
              outerHTMLSample: first.outerHTML.slice(0, 3000),
            };
          });
          console.log("product-tile elements found:", info.count);
          console.log("--- primer elemento ---");
          console.log(JSON.stringify(info, null, 2));

          await browser.close();
          EOF
      - name: Inspeccionar selectores reales de Womensecret
        run: node inspect-ws2.mjs
