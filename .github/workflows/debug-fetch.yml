name: Debug fetch 3 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar Nike y agregadores
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=================================================="
          echo "### NIKE: buscar JSON embebido o tarjetas de producto"
          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.nike.com/es/w/ofertas-3yaep" -o /tmp/nike.html
          echo "tamano: $(wc -c < /tmp/nike.html) bytes"
          grep -oE '__NEXT_DATA__|window\.INITIAL_REDUX_STATE|"products":\[|data-testid="product-card"' /tmp/nike.html | sort -u | head -10 || true

          echo "=================================================="
          echo "### PULL&BEAR con --compressed y siguiendo redirects"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.pullandbear.com/es/rebajas-c1030006000.html" -o /tmp/pb.html -w "HTTP final: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/pb.html) bytes"
          head -c 300 /tmp/pb.html
          echo ""

          echo "=================================================="
          echo "### CHOLLOMETRO ropa: estructura de tarjetas de oferta"
          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.chollometro.com/categorias/ropa" -o /tmp/chollometro.html
          echo "tamano: $(wc -c < /tmp/chollometro.html) bytes"
          grep -oE 'data-t="[a-zA-Z]*"|class="[a-zA-Z0-9_-]*threadListCard[a-zA-Z0-9_-]*"|class="[a-zA-Z0-9_-]*thread[a-zA-Z0-9_-]*"' /tmp/chollometro.html | sort -u | head -20 || true
          echo "--- enlaces salientes a tiendas conocidas ---"
          grep -oiE 'href="https?://(www\.)?(zara|nike|adidas|hm\.com|mango|bershka|pullandbear|decathlon|asos|zalando)[^"]*"' /tmp/chollometro.html | sort -u | head -10 || true

          echo "=================================================="
          echo "### BLOGDECHOLLOS moda: estructura"
          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.blogdechollos.com/moda/" -o /tmp/blog.html
          echo "tamano: $(wc -c < /tmp/blog.html) bytes"
          grep -oiE 'href="https?://(www\.)?(zara|nike|adidas|hm\.com|mango|bershka|pullandbear|decathlon|asos|zalando)[^"]*"' /tmp/blog.html | sort -u | head -10 || true
