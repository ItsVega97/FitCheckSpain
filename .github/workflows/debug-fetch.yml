          for b in blocks:
              snippet = b.strip()
              print("---LEN", len(snippet), "---")
              print(snippet[:600])
          '

          echo "=================================================="
          echo "### Puma es sale"
          fetch "https://es.puma.com/es/es/sale" /tmp/puma.html
          python3 -c '
          import re
          html = open("/tmp/puma.html", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"<script type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          print(f"bloques ld+json: {len(blocks)}")
          for b in blocks:
              snippet = b.strip()
              print("---LEN", len(snippet), "---")
              print(snippet[:600])
          '

          echo "=================================================="
          echo "### Skechers sale"
          fetch "https://www.skechers.com/sale/" /tmp/skechers.html
          python3 -c '
          import re
          html = open("/tmp/skechers.html", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"<script type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          print(f"bloques ld+json: {len(blocks)}")
          for b in blocks:
              snippet = b.strip()
              print("---LEN", len(snippet), "---")
              print(snippet[:600])
          '
