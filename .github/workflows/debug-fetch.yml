name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar ASOS
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/mujer/" -o /tmp/mujer-home.html
          echo "--- enlaces rebajas generales (sin a-to-z-of-brands) en portada mujer ---"
          grep -oiE 'href="[^"]*mujer/rebajas/cat/\?cid=[0-9]+"' /tmp/mujer-home.html | sort -u | head -10 || true

          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/hombre/rebajas/cat/?cid=8409" -o /tmp/asos.html
          echo "tamano: $(wc -c < /tmp/asos.html) bytes"
          python3 -c '
          html = open("/tmp/asos.html", encoding="utf-8", errors="replace").read()
          idx = html.find("plp._data")
          if idx == -1:
              print("NO aparece plp._data en absoluto en este HTML")
              idx2 = html.find("window.asos")
              print("primera aparicion de window.asos en:", idx2)
              if idx2 != -1:
                  print(html[idx2:idx2+400])
          else:
              print("Contexto alrededor de plp._data (400 antes, 400 despues):")
              print(html[max(0, idx-400):idx+400])
          '
