name: Debug fetch - segunda tanda (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Escribir script de sondeo 2
        run: |
          cat > probe2.mjs << 'EOF'
          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const candidates = [
            ["Kiabi", "https://www.kiabi.es/rebajas"],
            ["Naf Naf", "https://www.nafnaf.es/rebajas"],
            ["Blanco", "https://www.blanco.com/es/rebajas"],
            ["El Ganso", "https://www.elganso.com/es/rebajas"],
            ["Ecoalf", "https://ecoalf.com/es/rebajas"],
            ["Sfera", "https://www.sfera.com/es-es/rebajas"],
            ["Etam", "https://www.etam.com/es-es/rebajas"],
            ["Neck and Neck", "https://www.neckandneck.com/es/rebajas"],
            ["Purificacion Garcia", "https://www.purificaciongarcia.com/es/rebajas"],
            ["Adolfo Dominguez", "https://www.adolfodominguez.com/es/es/rebajas"],
            ["Panama Jack", "https://www.panamajack.com/es/rebajas"],
            ["Camper", "https://www.camper.com/es_ES/sale"],
            ["Geox", "https://www.geox.com/es_ES/sale"],
            ["Pepe Jeans", "https://www.pepejeans.com/es/rebajas"],
            ["Munich", "https://www.munich.com/es/rebajas"],
          ];

          function extractItemLists(html) {
            const blocks = [...html.matchAll(/<script type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)];
            const results = [];
            for (const [, raw] of blocks) {
              let data;
              try {
                data = JSON.parse(raw);
              } catch {
                continue;
              }
              const nodes = Array.isArray(data) ? data : data["@graph"] ? data["@graph"] : [data];
              for (const node of nodes) {
                const items = node.itemListElement || node.mainEntity?.itemListElement;
                if (Array.isArray(items) && items.length > 0) {
                  const looksLikeProducts = items.some(
                    (i) => i.item?.["@type"] === "Product" || i.item?.offers
                  );
                  if (looksLikeProducts) results.push(items.length);
                }
              }
            }
            return results;
          }

          for (const [name, url] of candidates) {
            try {
              const res = await fetch(url, {
                headers: {
                  "User-Agent": UA,
                  "Accept-Language": "es-ES,es;q=0.9",
                  Accept: "text/html,application/xhtml+xml",
                },
                signal: AbortSignal.timeout(12000),
              });
              const html = await res.text();
              const lists = extractItemLists(html);
              const hasProductTile = /product-tile|data-product|"@type":"Product"/i.test(html);
              console.log(
                `${name} | HTTP ${res.status} | ${html.length} bytes | ItemLists con productos: [${lists.join(",")}] | marcador product-tile/data-product: ${hasProductTile}`
              );
            } catch (e) {
              console.log(`${name} | ERROR: ${e.message}`);
            }
          }
          EOF
      - name: Sondear candidatas 2
        run: node probe2.mjs

      - name: Inspeccionar estructura de Womensecret
        run: |
          cat > inspect-ws.mjs << 'EOF'
          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          const res = await fetch("https://www.womensecret.com/es/rebajas", {
            headers: { "User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9" },
          });
          const html = await res.text();
          console.log("HTTP", res.status, html.length, "bytes");
          const idx = html.indexOf("product-tile");
          console.log("--- contexto product-tile ---");
          console.log(html.slice(Math.max(0, idx - 300), idx + 1500));
          EOF
          node inspect-ws.mjs
