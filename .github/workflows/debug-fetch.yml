name: Debug fetch - encontrar URL real rebajas (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de búsqueda de enlace real
        run: |
          cat > find-sale-url.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const browser = await chromium.launch();

          async function findSaleLinks(name, homepageUrl) {
            const context = await browser.newContext({ userAgent: UA, locale: "es-ES" });
            const page = await context.newPage();
            try {
              await page.goto(homepageUrl, { waitUntil: "networkidle", timeout: 30000 });
              await page.waitForTimeout(1500);
              const links = await page.evaluate(() => {
                return Array.from(document.querySelectorAll("a[href]"))
                  .map((a) => ({ href: a.getAttribute("href"), text: a.textContent.trim() }))
                  .filter(
                    (l) =>
                      /rebaja|sale|outlet|promo/i.test(l.href || "") ||
                      /rebaja|sale|outlet/i.test(l.text || ""),
                  )
                  .slice(0, 15);
              });
              console.log(`=== ${name} (${page.url()}) ===`);
              console.log(JSON.stringify(links, null, 2));
            } catch (e) {
              console.log(`${name} | ERROR: ${e.message}`);
            } finally {
              await context.close();
            }
          }

          await findSaleLinks("Womensecret", "https://womensecret.com/es/es");
          await findSaleLinks("Mango", "https://shop.mango.com/es/es");

          await browser.close();
          EOF
      - name: Buscar enlaces reales de rebajas
        run: node find-sale-url.mjs
