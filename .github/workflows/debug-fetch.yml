name: Debug fetch 10 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Estructura de producto en las candidatas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=================================================="
          echo "### Desigual rebajas"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.desigual.com/es_ES/rebajas/" -o /tmp/desigual.html -w "HTTP: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/desigual.html) bytes"
          grep -oE '"@type":"Product"|application/ld\+json|"products":\[|data-product|product-tile|product-item|window\.__' /tmp/desigual.html | sort -u | head -8 || true

          echo "=================================================="
          echo "### Superdry sale mens"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.superdry.com/sale/mens/" -o /tmp/superdry.html -w "HTTP: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/superdry.html) bytes"
          grep -oE '"@type":"Product"|application/ld\+json|"products":\[|data-product|product-tile|product-item|window\.__' /tmp/superdry.html | sort -u | head -8 || true

          echo "=================================================="
          echo "### Puma es sale (con locale correcto)"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://es.puma.com/es/es/sale" -o /tmp/puma.html -w "HTTP: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/puma.html) bytes"
          grep -oE '"@type":"Product"|application/ld\+json|"products":\[|data-product|product-tile|product-item|window\.__' /tmp/puma.html | sort -u | head -8 || true

          echo "=================================================="
          echo "### Skechers sale"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.skechers.com/sale/" -o /tmp/skechers.html -w "HTTP: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/skechers.html) bytes"
          grep -oE '"@type":"Product"|application/ld\+json|"products":\[|data-product|product-tile|product-item|window\.__' /tmp/skechers.html | sort -u | head -8 || true

          echo "=================================================="
          echo "### Footlocker: contexto de products["
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.footlocker.es/es/sale.html" -o /tmp/fl.html
          python3 -c '
          html = open("/tmp/fl.html", encoding="utf-8", errors="replace").read()
          idx = html.find("\"products\":[")
          print(html[max(0,idx-300):idx+1500])
          '
