name: Debug fetch 11 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: JSON-LD real de las 4 candidatas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          fetch() {
            curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 20 "$1" -o "$2" -w "HTTP: %{http_code}\n"
            echo "tamano: $(wc -c < "$2") bytes"
          }

          echo "=================================================="
          echo "### Desigual rebajas"
          fetch "https://www.desigual.com/es_ES/rebajas/" /tmp/desigual.html
          python3 -c '
          import re
          html = open("/tmp/desigual.html", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"<script type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          print(f"bloques ld+json: {len(blocks)}")
          for b in blocks:
              snippet = b.strip()
              print("---LEN", len(snippet), "---")
              print(snippet[:600])
          '

          echo "=================================================="
          echo "### Superdry sale mens"
          fetch "https://www.superdry.com/sale/mens/" /tmp/superdry.html
          python3 -c '
