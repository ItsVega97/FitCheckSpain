name: Debug fetch - headed bypass en más tiendas (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de prueba amplia
        run: |
          cat > headed-test.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

          const targets = [
            ["H&M", "https://www2.hm.com/es_es/sale/viewall.html"],
            ["Decathlon", "https://www.decathlon.es/browse/~/promociones"],
            ["Zalando", "https://www.zalando.es/outlet/"],
            ["Adidas", "https://www.adidas.es/ofertas"],
            ["Zara", "https://www.zara.com/es/es/mujer-special-prices-l1309.html"],
            ["Mango homepage", "https://shop.mango.com/es/es"],
          ];

          const browser = await chromium.launch({
            headless: false,
            args: ["--disable-blink-features=AutomationControlled"],
          });

          for (const [name, url] of targets) {
            const context = await browser.newContext({
              userAgent: UA,
              locale: "es-ES",
              timezoneId: "Europe/Madrid",
              viewport: { width: 1366, height: 768 },
              extraHTTPHeaders: { "Accept-Language": "es-ES,es;q=0.9,en;q=0.8" },
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, "webdriver", { get: () => undefined });
            });
            const page = await context.newPage();
            try {
              const res = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 25000 });
              await page.waitForTimeout(2000);
              const html = await page.content();
              console.log(`${name}: HTTP ${res.status()} | ${html.length} bytes | title="${await page.title()}"`);
            } catch (e) {
              console.log(`${name}: ERROR ${e.message}`);
            } finally {
              await context.close();
            }
          }

          await browser.close();
          EOF
      - name: Lanzar Xvfb y probar todas
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 node headed-test.mjs
