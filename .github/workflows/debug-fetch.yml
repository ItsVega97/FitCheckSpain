name: Debug fetch - Womensecret tile markup (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Escribir script de inspección de tile
        run: |
          cat > inspect-tile.mjs << 'EOF'
          import { chromium } from "playwright";

          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          const browser = await chromium.launch();
          const context = await browser.newContext({ userAgent: UA, locale: "es-ES" });
          const page = await context.newPage();
          await page.goto("https://womensecret.com/es/es/promociones/remate-final/mujer", {
            waitUntil: "networkidle",
            timeout: 30000,
          });
          await page.waitForTimeout(2500);

          const info = await page.evaluate(() => {
            const tiles = document.querySelectorAll(".productTile");
            if (tiles.length === 0) return { count: 0 };
            const t = tiles[1] || tiles[0];
            return {
              count: tiles.length,
              html: t.outerHTML.slice(0, 4000),
            };
          });
          console.log("productTile count:", info.count);
          console.log(info.html);

          await browser.close();
          EOF
      - name: Inspeccionar markup del tile
        run: node inspect-tile.mjs
