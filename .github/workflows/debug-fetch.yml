name: Debug fetch 4 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar NEXT_DATA de Nike y enlace real de Chollometro
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.nike.com/es/w/ofertas-3yaep" -o /tmp/nike.html
          python3 -c '
          import re, json
          html = open("/tmp/nike.html", encoding="utf-8", errors="replace").read()
          m = re.search(r"<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>", html, re.DOTALL)
          if not m:
              print("NO SE ENCONTRO __NEXT_DATA__")
          else:
              data = json.loads(m.group(1))
              print("Claves top-level:", list(data.keys()))
              props = data.get("props", {})
              print("Claves props:", list(props.keys()))
              pageProps = props.get("pageProps", {})
              print("Claves pageProps:", list(pageProps.keys()))

              def find_products(obj, path, depth=0):
                  if depth > 8 or obj is None:
                      return None
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          if k.lower() == "products" and isinstance(v, list) and v:
                              return (path + "." + k, v)
                          found = find_products(v, path + "." + k, depth + 1)
                          if found:
                              return found
                  elif isinstance(obj, list):
                      for i, v in enumerate(obj[:5]):
                          found = find_products(v, path + "[" + str(i) + "]", depth + 1)
                          if found:
                              return found
                  return None

              result = find_products(data, "data")
              if not result:
                  print("No se encontro products")
              else:
                  path, products = result
                  print("Encontrado en:", path, "numero:", len(products))
                  print("Claves primer producto:", list(products[0].keys()))
                  print(json.dumps(products[0], ensure_ascii=False)[:2000])
          '

          echo "=================================================="
          echo "### CHOLLOMETRO: primer bloque threadListCard completo"
          curl -s --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.chollometro.com/categorias/ropa" -o /tmp/chollometro.html
          python3 -c '
          html = open("/tmp/chollometro.html", encoding="utf-8", errors="replace").read()
          idx = html.find("threadListCard-mainLink")
          if idx == -1:
              idx = html.find("threadListCard")
          print(html[max(0,idx-200):idx+1200])
          '
