name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar ASOS
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/hombre/rebajas/cat/?cid=8409" -o /tmp/asos.html
          echo "tamano: $(wc -c < /tmp/asos.html) bytes"
          python3 -c '
          import json
          sq = chr(39)
          dq = chr(34)
          bs = chr(92)
          html = open("/tmp/asos.html", encoding="utf-8", errors="replace").read()
          marker = "window.asos.plp._data=JSON.parse(" + sq
          start = html.find(marker)
          if start == -1:
              print("NO SE ENCONTRO el marcador JSON.parse")
          else:
              i = start + len(marker)
              buf = []
              n = len(html)
              while i < n:
                  c = html[i]
                  if c == bs and i + 1 < n:
                      buf.append(c)
                      buf.append(html[i + 1])
                      i += 2
                      continue
                  if c == sq:
                      break
                  buf.append(c)
                  i += 1
              captured = "".join(buf)
              captured = captured.replace(bs + sq, sq)
              overescaped = bs + bs + dq
              proper = bs + dq
              while overescaped in captured:
                  captured = captured.replace(overescaped, proper)
              try:
                  data = json.loads(captured)
                  print("Claves de primer nivel:", list(data.keys()))
              except Exception as e:
                  print("Fallo al parsear:", e)
                  pos = getattr(e, "pos", None)
                  if pos is not None:
                      print("Contexto alrededor del fallo:")
                      print(repr(captured[max(0, pos - 150):pos + 150]))
                  data = None

              if data is not None:
                  def find_products(obj, path):
                      if isinstance(obj, dict):
                          for k, v in obj.items():
                              if k.lower() == "products" and isinstance(v, list) and v:
                                  return (path + "." + k, v)
                              found = find_products(v, path + "." + k)
                              if found:
                                  return found
                      elif isinstance(obj, list):
                          for i, v in enumerate(obj[:5]):
                              found = find_products(v, path + "[" + str(i) + "]")
                              if found:
                                  return found
                      return None

                  result = find_products(data, "data")
                  if not result:
                      print("No se encontro ninguna clave products en el JSON")
                  else:
                      path, products = result
                      print("Encontrado en:", path, "- numero de productos:", len(products))
                      print("Claves del primer producto:", list(products[0].keys()))
                      print("Primer producto completo:")
                      print(json.dumps(products[0], ensure_ascii=False))
          '
