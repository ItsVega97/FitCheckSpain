name: Debug fetch 14 (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Contexto salePrice en Puma
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -s -L --compressed -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 20 \
            "https://es.puma.com/es/es/sale" -o /tmp/puma.html -w "HTTP: %{http_code}\n"
          echo "tamano: $(wc -c < /tmp/puma.html) bytes"
          python3 -c '
          html = open("/tmp/puma.html", encoding="utf-8", errors="replace").read()
          idx = html.find("salePrice")
          print(html[max(0,idx-600):idx+1000])
          '
