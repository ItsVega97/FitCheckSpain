name: Debug fetch (temporal)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar ASOS
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/mujer/" -o /tmp/mujer-home.html
          echo "--- enlaces rebajas generales (sin a-to-z-of-brands) en portada mujer ---"
          grep -oiE 'href="[^"]*mujer/rebajas/cat/\?cid=[0-9]+"' /tmp/mujer-home.html | sort -u | head -10 || true

          curl -s -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 15 \
            "https://www.asos.com/es/hombre/rebajas/cat/?cid=8409" -o /tmp/asos.html
          echo "tamano: $(wc -c < /tmp/asos.html) bytes"
          python3 -c '
          import re, json
          html = open("/tmp/asos.html", encoding="utf-8", errors="replace").read()
          m = re.search(r"window\.asos\.plp\._data\s*=\s*(\{.*?\});", html, re.DOTALL)
          if not m:
              print("NO SE ENCONTRO el bloque window.asos.plp._data")
          else:
              blob = m.group(1)
              print("Longitud del bloque JSON:", len(blob))
              try:
                  data = json.loads(blob)
                  print("Claves de primer nivel:", list(data.keys())[:20])
                  products = data.get("products") or data.get("Products")
                  if products:
                      print("Numero de productos:", len(products))
                      print("Claves del primer producto:", list(products[0].keys()))
                      print("Primer producto:", json.dumps(products[0], ensure_ascii=False)[:1500])
                  else:
                      print(json.dumps(data, ensure_ascii=False)[:1500])
              except Exception as e:
                  print("Fallo al parsear JSON:", e)
                  print(blob[:1500])
          '
